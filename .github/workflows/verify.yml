name: Verify workshop
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: mechanical_workshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workshop -d mechanical_workshop"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://workshop:ci-only-disposable-password@127.0.0.1:5432/mechanical_workshop
      APP_ORIGIN: http://127.0.0.1:3070
      COOKIE_SECURE: "false"
      DEMO_PASSWORD: ci-only-fictional-staff-password
      ALLOW_DEMO_SIGNUP: "true"
      MAX_DEMO_WORKSPACES: "100"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:design
      - run: npm run db:migrate && npm run db:seed
      - run: npm run build
      - name: Verify production HTTP workflows
        shell: bash
        run: |
          npm run start > /tmp/workshop-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --silent --fail "$APP_ORIGIN" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          npm run test:integration
